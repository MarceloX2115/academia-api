# Perfil "postgres": ative com  --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:academia}
spring.datasource.username=${DB_USER:academia}
spring.datasource.password=${DB_PASSWORD:academia}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update